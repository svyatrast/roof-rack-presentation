<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запаска S31 — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: інженерний, спокійний — як аркуш складального креслення на столі контролера.
   IDEA: 3D-складальне креслення без розмірів: деталі з номерами позицій, карта напружень, анімації.
   PICTURE: великий 3D-вид виробу на машині, кольорова карта МСЕ поверх деталей.
   COLOUR and TYPE: камінь #e7e4df, чорний, цегла #c8371e як акцент; Schibsted Grotesk.
   LAYOUT: заголовок-висновок, вид на всю ширину, під ним керування і легенда; на телефоні — у стовпчик. */
:root{color-scheme:light dark;--bg:light-dark(#e7e4df,#171513);--ink:light-dark(#141414,#ece8e2);--mut:light-dark(#5b5853,#a8a39b);--pan:light-dark(#ffffff,#22201d);--line:light-dark(#cfcac2,#3a3732);--acc:#c8371e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
header{padding:20px max(4vw,16px) 12px;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:end;justify-content:space-between}
h1{font-size:clamp(24px,3.4vw,40px);line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
header p{margin:0;max-width:62ch;color:var(--mut)}
.stage{position:relative;margin:0 max(4vw,16px);height:min(68vh,760px);min-height:380px;border:1px solid var(--line);background:linear-gradient(light-dark(#f4f2ee,#1f1d1a),light-dark(#dcd8d1,#121110))}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none}
.cap{position:absolute;left:14px;right:14px;top:12px;font-weight:600;font-size:15px;pointer-events:none;text-shadow:0 1px 0 light-dark(#fff,#000)}
.cap small{display:block;font-weight:400;color:var(--mut)}
.legend{position:absolute;left:14px;bottom:12px;background:var(--pan);border:1px solid var(--line);padding:8px 10px;font-size:13px;width:min(320px,calc(100% - 28px))}
.bar{height:12px;margin:6px 0 2px;position:relative}
.ticks{display:flex;justify-content:space-between;color:var(--mut);font-variant-numeric:tabular-nums}
.yield{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.card{position:absolute;right:12px;bottom:12px;background:var(--pan);border:1px solid var(--line);padding:10px 12px;max-width:min(300px,calc(100% - 24px));font-size:14px;display:none}
.card b{display:block;font-size:15px}.card .poz{color:var(--acc);font-weight:700}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut)}
.ctl{margin:12px max(4vw,16px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.grp{background:var(--pan);border:1px solid var(--line);padding:12px}
.grp h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:15px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select{flex:1 1 220px}
label.sl{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:8px;align-items:center;width:100%;font-size:14px}
input[type=range]{width:100%;accent-color:var(--acc);height:44px}
.out{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;gap:6px;align-items:center;min-height:44px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.notes{margin:14px max(4vw,16px) 28px;color:var(--mut);font-size:14px;max-width:110ch}
.notes b{color:var(--ink)}
@media(max-width:600px){.stage{height:58vh}.legend{font-size:12px}.cap{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
<div><h1 data-i="h1">Кріплення запаски S31 — 3D-збірка і напруження</h1>
<p data-i="lead">Колесо 31″ 50 кг. У їзді найбільші напруження 77–80 МПа, межа текучості 235 МПа. Перевищення є лише на відкритій калітці з подвійним навантаженням.</p></div>
<div class="row" role="group" aria-label="Мова / Language"><button id="lUK" class="on" lang="uk">UA</button><button id="lEN" lang="en">EN</button></div>
</header>
<div class="stage" id="stage">
<div class="load" id="load" data-i="loading">Завантаження моделі…</div>
<div class="cap" id="cap"></div>
<div class="legend" id="legend" hidden>
<div id="lgT" data-i="lgT">σ Мізеса, МПа</div>
<div class="bar" id="bar"><div class="yield" id="yl" title="σт 235"></div></div>
<div class="ticks" id="ticks"></div>
<div style="margin-top:4px;color:var(--mut)" id="lgN"></div>
</div>
<div class="card" id="card"></div>
</div>
<div class="ctl">
<div class="grp"><h2 data-i="gAnim">Анімація</h2><div class="row">
<button class="go" id="bAsm" data-i="bAsm">▶ Збірка на авто</button><button class="go" id="bOpen" data-i="bOpen">▶ Відкривання 180°</button><button id="bStop" data-i="bStop">■ Стоп</button></div></div>
<div class="grp"><h2 data-i="gView">Вигляд</h2><div class="row">
<button class="on" id="mMetal" data-i="mMetal">Метал</button><button id="mStress" data-i="mStress">Напруження</button>
<select id="lc" aria-label="Розрахунковий випадок"></select></div>
<div class="row" style="margin-top:6px"><span style="font-size:14px;color:var(--mut)" data-i="scale">Шкала</span><button id="sc100" data-i="sc100">0–100 МПа</button><button class="on" id="sc250" data-i="sc250">0–250 МПа</button></div></div>
<div class="grp"><h2 data-i="gPos">Положення</h2>
<label class="sl"><span data-i="sExp">Рознесення</span><input type="range" id="sExp" min="0" max="100" value="0"><span class="out" id="oExp">0 %</span></label>
<label class="sl"><span data-i="sAng">Калітка</span><input type="range" id="sAng" min="0" max="180" value="0"><span class="out" id="oAng">0°</span></label></div>
<div class="grp"><h2 data-i="gShow">Показати</h2><div class="row">
<label class="chk"><input type="checkbox" id="cCar" checked><span data-i="cCar">Авто</span></label>
<label class="chk"><input type="checkbox" id="cGlass"><span data-i="cGlass">Авто прозоре</span></label>
<label class="chk"><input type="checkbox" id="cWheel" checked><span data-i="cWheel">Колесо</span></label>
<label class="chk"><input type="checkbox" id="cEdge" checked><span data-i="cEdge">Ребра</span></label></div>
<div class="row" style="margin-top:6px"><button id="vRear" data-i="vRear">Ззаду</button><button id="vIso">3/4</button><button id="vSide" data-i="vSide">Збоку</button><button id="vTop" data-i="vTop">Зверху</button><button id="vHinge" data-i="vHinge">Петля</button></div></div>
</div>
<div class="notes" data-i="notes"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

 loading:"Завантаження моделі…", loadErr:"Не вдалося завантажити модель: ", lgT:"σ Мізеса, МПа", gAnim:"Анімація", bAsm:"▶ Збірка на авто", bOpen:"▶ Відкривання 180°", bStop:"■ Стоп",
 gView:"Вигляд", mMetal:"Метал", mStress:"Напруження", lcAria:"Розрахунковий випадок", scale:"Шкала", sc100:"0–100 МПа", sc250:"0–250 МПа", gPos:"Положення", sExp:"Рознесення", sAng:"Калітка",
 gShow:"Показати", cCar:"Авто", cGlass:"Авто прозоре", cWheel:"Колесо", cEdge:"Ребра", vRear:"Ззаду", vSide:"Збоку", vTop:"Зверху", vHinge:"Петля",

 LCN:{"LC1 стоянка 1g":"LC1 · parked 1g","LC2 яма 3g":"LC2 · pothole 3g","LC4 гальмування 1g + 1g":"LC4 · braking 1g + 1g","LC6 поворот 1g (+x) + 1g":"LC6 · cornering 1g + 1g","LC8b відкрита 90° 2g":"LC8b · open 90°, 2g"},
 STEPS:["",
 "1 · Couplings (item 20) screw into the towing eyes by their LH thread, 50 mm deep, torque 100–120 N·m",

let LANG = "uk";

$("bar").style.background = "linear-gradient(90deg," + STOPS.map(([t, c]) => `rgb(${c.map(x => Math.round(x * 255)).join(",")}) ${t * 100}%`).join(",") + ")";

const ghost = new THREE.MeshLambertMaterial({color:0x9a9a9a, transparent:true, opacity:0.18, depthWrite:false, side:THREE.DoubleSide});
const edgeMat = new THREE.LineBasicMaterial({color:0x0d0d0d, transparent:true, opacity:0.55});

function geom(vb, fb, flat, T) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(T === Int16Array ? new Float32Array(dec(vb, Int16Array)) : dec(vb, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(dec(fb, Uint32Array), 1));
  return g;
}
function finish(g, flat) { const h = flat ? g.toNonIndexed() : g; h.computeVertexNormals(); return h; }
function prep(g0, flat, sMap) {          // геометрія з атрибутом кольору + відповідність вершин → вузлам
  const g = finish(g0.clone(), flat), n = g.attributes.position.count;
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const map = flat ? g0.index.array : null;
  const S = {}; for (const [k, b] of Object.entries(sMap)) S[k] = b ? dec(b, Uint8Array) : null;
  return {g, map, S};
}
const sAt = (o, i) => { const s = o.S[lc]; return s ? s[o.map ? o.map[i] : i] * 2 : null; };
function recolor(o) {
  const c = o.g.attributes.color.array, n = c.length / 3;
  for (let i = 0; i < n; i++) { const v = sAt(o, i); c.set(v === null ? [0.62, 0.63, 0.65] : cmap(v), i * 3); }
  o.g.attributes.color.needsUpdate = true;
}
function build() {
  const hp = new THREE.Vector3(...M.hinge);
  gate.position.copy(hp);
  const pivotOf = p => p.grp === "static" ? new THREE.Vector3() : hp;
  for (const p of M.parts) {
    const g0 = geom(p.v, p.f);
    const pr = prep(g0, !p.smooth, p.s);
    const mat = new THREE.MeshStandardMaterial({color:MAT[p.mat] || 0x777777, metalness:p.mat === "steel" ? 0.25 : 0.45, roughness:p.mat === "pe" ? 0.8 : 0.55, side:THREE.DoubleSide, flatShading:!p.smooth});
    const smat = new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(pr.g, mat);
    const parent = p.grp === "static" ? root : p.grp === "gate" ? gate : wheel;
    const off = pivotOf(p);
    // вісь обертання для «закручування»
    let piv = new THREE.Group(); parent.add(piv);
    g0.computeBoundingBox(); const c = g0.boundingBox.getCenter(new THREE.Vector3()).sub(off);
    const axisC = p.spin === "z" ? new THREE.Vector3(c.x, c.y, 0) : p.spin === "y" ? new THREE.Vector3(c.x, 0, c.z) : new THREE.Vector3();
    piv.position.copy(axisC); mesh.position.copy(off.clone().negate().sub(axisC));
    piv.add(mesh);
    let edges = null;
    if (p.mat !== "tire" && !p.smooth) { edges = new THREE.LineSegments(new THREE.EdgesGeometry(g0, 28), edgeMat); edges.position.copy(mesh.position); piv.add(edges); }
    const o = {p, piv, mesh, edges, mat, smat, g:pr.g, map:pr.map, S:pr.S, base:axisC.clone(), exp:new THREE.Vector3(...p.exp)};
    mesh.userData.o = o; parts.push(o); pick.push(mesh);
  }
  // поля МСЕ
  for (const k of ["J", "P"]) {
    const f = M.fe[k]; const pr = prep(geom(f.v, f.f), false, f.s);
    const mesh = new THREE.Mesh(pr.g, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide}));
    if (f.grp === "gate") mesh.position.copy(hp).negate();
    (f.grp === "gate" ? gate : root).add(mesh); mesh.visible = false;
    Object.assign(M.fe[k], {mesh, g:pr.g, map:null, S:pr.S, geos:pr.S});
    mesh.userData.fe = k; pick.push(mesh);
  }
  // авто і земля
  const cg = finish(geom(M.car.v, M.car.f, true, Int16Array), true);
  M.carMat = new THREE.MeshStandardMaterial({color:0xc9ced4, metalness:0.1, roughness:0.75, side:THREE.DoubleSide, flatShading:true, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  M.carMesh = new THREE.Mesh(cg, M.carMat); scene.add(M.carMesh);
  const grd = new THREE.Mesh(new THREE.CircleGeometry(5200, 64), new THREE.MeshLambertMaterial({color:0xb9b3a8, transparent:true, opacity:0.35}));
  grd.rotation.x = -Math.PI / 2; grd.position.y = M.ground - 1; scene.add(grd);
  lc = M.lcs[0]; setLang(LANG);
  view("iso"); apply(); $("load").remove();
}
function apply() {
  const st = mode === "stress";
  $("legend").hidden = !st;
  const feOn = k => st && M.fe[k].geos[lc];
  for (const k of ["J", "P"]) { const f = M.fe[k]; f.mesh.visible = !!feOn(k); if (st && f.S[lc]) recolor(f); }
  for (const o of parts) {
    const hide = o.p.fe && feOn(o.p.fe);
    o.piv.visible = !hide && (o.p.grp !== "wheel" || $("cWheel").checked);
    o.mesh.material = st ? (o.p.grp === "wheel" ? ghost : o.smat) : o.mat; if (st) recolor(o);
    if (o.edges) o.edges.visible = $("cEdge").checked;
  }
  wheel.visible = $("cWheel").checked;
  M.carMesh.visible = $("cCar").checked;
  M.carMat.transparent = $("cGlass").checked; M.carMat.opacity = $("cGlass").checked ? 0.25 : 1; M.carMat.depthWrite = !$("cGlass").checked;
  $("mMetal").classList.toggle("on", !st); $("mStress").classList.toggle("on", st);
}
function pose(t) {                      // t: стан анімації збірки (крок + частка) або null
  for (const o of parts) {
    let k = explode, show = true, spin = 0;
    if (t !== null) {
      const s = o.p.step; if (t < s - 1) { show = false; k = 1; } else { const f = Math.min(Math.max(t - (s - 1), 0), 1); k = 1 - ease(f); }
    }
    o.piv.position.copy(o.base).addScaledVector(o.exp, k);
    if (o.p.spin) { spin = k * Math.PI * 10; if (o.p.spin === "z") o.piv.rotation.z = spin; else o.piv.rotation.y = spin; }
    if (t !== null) o.piv.visible = show && !(o.p.grp === "wheel" && !$("cWheel").checked);
  }
  for (const k of ["J", "P"]) { const f = M.fe[k]; if (f.mesh) f.mesh.visible = mode === "stress" && !!f.geos[lc] && t === null; }
  gate.rotation.y = angle * Math.PI / 180;
}
const ease = f => f < 0.5 ? 2 * f * f : 1 - (-2 * f + 2) ** 2 / 2;
function view(v) {
  const T = {rear:[[60, 500, 3700], [60, 300, 0]], iso:[[1650, 900, 1900], [80, 150, 0]], side:[[3400, 500, 300], [0, 150, -300]], top:[[60, 3600, 400], [60, 0, 0]], hinge:[[1050, 420, 650], [600, 20, 60]]}[v];
  cam.position.set(...T[0]); ctr.target.set(...T[1]); ctr.update();
}
function setAngle(a) { angle = a; $("sAng").value = Math.round(a); $("oAng").textContent = Math.round(a) + "°"; }
function startAsm() {
  stop(); explode = 0; $("sExp").value = 0; $("oExp").textContent = "0 %"; setAngle(0);
  anim = {kind:"asm", t0:performance.now()}; view("iso");
}
function startOpen() { stop(); anim = {kind:"open", t0:performance.now()}; }
function stop() { anim = null; $("cap").innerHTML = ""; pose(null); apply(); }
const DUR = {asm:8.6 * 1.4, open:9.5};
function animAt(kind, sec) {            // стан анімації в момент sec; true — завершено
  if (kind === "asm") {
    const t = sec / 1.4;
    if (t > 8.6) return true;
    const s = Math.min(Math.floor(t) + 1, 8); $("cap").innerHTML = L("STEPS")[s] + "<small>" + L("step")(s) + "</small>"; pose(t); return false;
  }
  let a, done = false;
  if (sec < 4) a = 180 * ease(sec / 4); else if (sec < 5.5) a = 180; else if (sec < 9.5) a = 180 * (1 - ease((sec - 5.5) / 4)); else { a = 0; done = true; }
  setAngle(a); pose(null);
  $("cap").innerHTML = done ? "" : `${L("opening")}: ${Math.round(a)}°<small>${L("openSub")}</small>`;
  return done;
}
function tick(now) {
  if (anim && !anim.ext) { if (animAt(anim.kind, (now - anim.t0) / 1000)) { anim.kind === "asm" ? stop() : (anim = null); } }
  ctr.update(); renderer.render(scene, cam); requestAnimationFrame(tick);
}
window.S31 = {                          // керування для запису відео
  frame(kind, sec, pos, tgt) { anim = {ext:true}; animAt(kind, sec); if (pos) { cam.position.set(...pos); ctr.target.set(...tgt); } ctr.update(); renderer.render(scene, cam); },
  end() { stop(); }, dbg:() => ({scene, M, renderer}), lang:setLang
};
// вибір деталі
const ray = new THREE.Raycaster(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({x:(e.clientX - r.left) / r.width * 2 - 1, y:-(e.clientY - r.top) / r.height * 2 + 1}, cam);
  const hit = ray.intersectObjects(pick.filter(m => m.visible && m.parent.visible && (!m.parent.parent || m.parent.parent.visible)), false)[0];
  const card = $("card");
  if (!hit) { card.style.display = "none"; return; }
  let html, val = null;
  const fa = hit.face, near = o => Math.max(...[fa.a, fa.b, fa.c].map(i => sAt(o, i) ?? -1));
  if (hit.object.userData.fe) {
    const k = hit.object.userData.fe; val = near(M.fe[k]);
    html = `<b>${k === "J" ? L("feJ") : L("feP")}</b>${L("feSub")}<br>`;
  } else {
    const o = hit.object.userData.o;
    html = `<span class="poz">${L("poz")} ${partPoz(o.p)}</span><b>${partName(o.p)}</b>`;
    if (mode === "stress") { if (o.S[lc]) { val = near(o); html += L("beam") + "<br>"; } else html += L("noData"); }
  }
  if (val !== null && val >= 0 && mode === "stress") html += `σ ≈ ${Math.round(val)} ${L("mpa")} · ${L("LCN")[lc]}`;
  card.innerHTML = html; card.style.display = "block";
});
$("lUK").onclick = () => setLang("uk"); $("lEN").onclick = () => setLang("en");
addEventListener("hashchange", () => { if (location.hash === "#en" || location.hash === "#uk") setLang(location.hash.slice(1)); });
$("sc100").onclick = () => { SC = 100; legend(); apply(); }; $("sc250").onclick = () => { SC = 250; legend(); apply(); };
$("bAsm").onclick = startAsm; $("bOpen").onclick = startOpen; $("bStop").onclick = stop;
$("mMetal").onclick = () => { mode = "metal"; apply(); pose(null); };
$("mStress").onclick = () => { mode = "stress"; if (M.open[lc] !== undefined) setAngle(M.open[lc]); apply(); pose(null); };
$("lc").onchange = e => { lc = e.target.value; if (M.open[lc] !== undefined) setAngle(M.open[lc]); else if (mode === "stress") setAngle(0); if (mode !== "stress") mode = "stress"; apply(); pose(null); };
$("sExp").oninput = e => { anim = null; explode = e.target.value / 100; $("oExp").textContent = e.target.value + " %"; pose(null); };
$("sAng").oninput = e => { anim = null; setAngle(+e.target.value); pose(null); };
for (const id of ["cCar", "cGlass", "cWheel", "cEdge"]) $(id).onchange = () => { apply(); pose(null); };
for (const [id, v] of [["vRear", "rear"], ["vIso", "iso"], ["vSide", "side"], ["vTop", "top"], ["vHinge", "hinge"]]) $(id).onclick = () => view(v);
fetch("model.json").then(r => r.json()).then(j => { M = j; build(); resize(); requestAnimationFrame(tick); })
  .catch(err => { $("load").textContent = L("loadErr") + err.message; });
}
